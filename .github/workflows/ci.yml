name: CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, lint, test & build docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Build
        run: npm run build

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest with coverage
        run: npm run test

      - name: Generate documentation
        run: npm run doc
